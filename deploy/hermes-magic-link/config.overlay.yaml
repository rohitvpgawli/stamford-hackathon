# Apply to a new, isolated Hermes profile named mango-production.
model:
  default: deepseek/deepseek-v4-flash-0731
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions
agent:
  max_turns: 4
memory:
  memory_enabled: false
  user_profile_enabled: false
platform_toolsets:
  cli: []
  api_server: []
gateway:
  api_server:
    enabled: true
    host: 127.0.0.1
    port: 8644
    model_name: mango
    max_concurrent_runs: 4
